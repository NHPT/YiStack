name: Bug report
description: Report a reproducible YiStack defect
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the private channel in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: YiStack commit
      description: Commit SHA or release tag where the issue occurs.
      placeholder: 0123456789abcdef
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Generation and validation
        - Workspace UI
        - Backend API
        - Database and Supabase
        - Podman runtime and preview
        - GitHub integration
        - Deployment provider
        - Collaboration and templates
        - Documentation and tooling
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal deterministic steps and input. Remove credentials and user data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized logs and screenshots when useful.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node, pnpm, Go, Podman, browser, database mode, and provider type.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing issue.
          required: true
        - label: I removed secrets, credentials, and private data.
          required: true
        - label: This is not a security vulnerability.
          required: true
