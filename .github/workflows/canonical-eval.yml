name: Live canonical eval smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: canonical-eval
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run one real canonical sample
        env:
          YISTACK_EVAL_BASE_URL: ${{ vars.YISTACK_EVAL_BASE_URL }}
          YISTACK_EVAL_TOKEN: ${{ secrets.YISTACK_EVAL_TOKEN }}
          YISTACK_EVAL_PROVIDER: ${{ vars.YISTACK_EVAL_PROVIDER }}
          YISTACK_EVAL_MODEL: ${{ vars.YISTACK_EVAL_MODEL }}
        run: pnpm eval:smoke
