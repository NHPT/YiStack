name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate release tag
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run release gates
        run: |
          pnpm lint
          pnpm build
          pnpm validate:release:demo
          pnpm yes:validate
          (cd backend && go test ./...)
          git diff --check

  package:
    name: Package linux/${{ matrix.arch }}
    needs: quality
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Build deployment package
        env:
          REQUIRE_CLEAN_TREE: "true"
          TARGET_ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: pnpm build:release

      - name: Validate deployment package
        run: |
          scripts/validate-release-package.sh \
            "dist/release/yistack-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz" \
            "${{ matrix.arch }}"
          scripts/validate-release-postgres-runtime.sh \
            "dist/release/yistack-${{ github.ref_name }}-linux-${{ matrix.arch }}"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist/release/yistack-${{ github.ref_name }}-linux-${{ matrix.arch }}
          format: spdx-json
          output-file: dist/release/yistack-${{ github.ref_name }}-linux-${{ matrix.arch }}.spdx.json
          upload-artifact: false

      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/release/yistack-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz
            dist/release/yistack-${{ github.ref_name }}-linux-${{ matrix.arch }}.spdx.json

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/release/yistack-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz
            dist/release/yistack-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz.sha256
            dist/release/yistack-${{ github.ref_name }}-linux-${{ matrix.arch }}.spdx.json

  publish:
    name: Publish GitHub Release
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate combined checksums
        working-directory: release-assets
        run: sha256sum *.tar.gz *.spdx.json > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "YiStack $GITHUB_REF_NAME" \
              release-assets/*
          fi
