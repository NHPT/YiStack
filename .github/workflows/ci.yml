name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change_scope:
    name: Change scope
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          docs_only=false
          if [[ "$EVENT_NAME" == "pull_request" ]] &&
             git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
             git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            mapfile -t changed_files < <(
              git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA"
            )
            if (( ${#changed_files[@]} > 0 )); then
              docs_only=true
              for file in "${changed_files[@]}"; do
                case "$file" in
                  *.md|docs/*) ;;
                  *)
                    docs_only=false
                    break
                    ;;
                esac
              done
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          printf 'Documentation-only change: %s\n' "$docs_only"

  repository_contract:
    name: Repository contract
    needs: change_scope
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate repository contract
        run: |
          bash scripts/verify-repository-integrity.sh
          node scripts/validate-contributor-alpha.mjs

  quality:
    name: Quality gate
    needs: [change_scope, repository_contract]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Enforce prerequisite jobs
        env:
          CHANGE_SCOPE_RESULT: ${{ needs.change_scope.result }}
          REPOSITORY_CONTRACT_RESULT: ${{ needs.repository_contract.result }}
        run: |
          if [ "$CHANGE_SCOPE_RESULT" != "success" ] ||
             [ "$REPOSITORY_CONTRACT_RESULT" != "success" ]; then
            echo "Required CI prerequisite failed." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Install dependencies
        if: needs.change_scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        if: needs.change_scope.outputs.docs_only != 'true'
        run: pnpm audit --audit-level high --ignore-registry-errors

      - name: Install Playwright Chromium
        if: needs.change_scope.outputs.docs_only != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Public release audit
        run: GITLEAKS_BIN="$(go env GOPATH)/bin/gitleaks" pnpm release:audit

      - name: ESLint
        if: needs.change_scope.outputs.docs_only != 'true'
        run: pnpm lint

      - name: Production build
        if: needs.change_scope.outputs.docs_only != 'true'
        run: pnpm build

      - name: Install Podman for deployment acceptance
        if: needs.change_scope.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Deployment package acceptance
        if: needs.change_scope.outputs.docs_only != 'true'
        env:
          SKIP_FRONTEND_BUILD: "true"
          TARGET_ARCH: amd64
          VERSION: v0.0.0
        run: |
          pnpm validate:release:demo
          pnpm build:release
          scripts/validate-release-package.sh \
            dist/release/yistack-v0.0.0-linux-amd64.tar.gz amd64
          scripts/validate-release-postgres-runtime.sh \
            dist/release/yistack-v0.0.0-linux-amd64

      - name: VIS-001 browser acceptance
        if: needs.change_scope.outputs.docs_only != 'true'
        run: pnpm test:vis001-browser

      - name: VIS-002 browser acceptance
        if: needs.change_scope.outputs.docs_only != 'true'
        run: pnpm test:vis002-browser

      - name: COLLAB-001 browser acceptance
        if: needs.change_scope.outputs.docs_only != 'true'
        run: pnpm test:collab001-browser

      - name: YES engineering gate
        if: needs.change_scope.outputs.docs_only != 'true'
        run: pnpm yes:validate

      - name: Patch whitespace
        run: git diff --check

  clean-checkout:
    name: Clean checkout reproducibility
    needs: [change_scope, repository_contract]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce prerequisite jobs
        env:
          CHANGE_SCOPE_RESULT: ${{ needs.change_scope.result }}
          REPOSITORY_CONTRACT_RESULT: ${{ needs.repository_contract.result }}
        run: |
          if [ "$CHANGE_SCOPE_RESULT" != "success" ] ||
             [ "$REPOSITORY_CONTRACT_RESULT" != "success" ]; then
            echo "Required CI prerequisite failed." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Go
        if: needs.change_scope.outputs.docs_only != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum

      - name: Install Podman
        if: needs.change_scope.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Verify clean checkout
        if: needs.change_scope.outputs.docs_only != 'true'
        env:
          YISTACK_REQUIRE_CLEAN_TREE: "true"
        run: bash scripts/verify-clean-checkout.sh
