name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify repository integrity
        run: bash scripts/verify-repository-integrity.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Public release audit
        run: GITLEAKS_BIN="$(go env GOPATH)/bin/gitleaks" pnpm release:audit

      - name: ESLint
        run: pnpm lint

      - name: Production build
        run: pnpm build

      - name: YES engineering gate
        run: pnpm yes:validate

      - name: Patch whitespace
        run: git diff --check

  clean-checkout:
    name: Clean checkout reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Verify clean checkout
        env:
          YISTACK_REQUIRE_CLEAN_TREE: "true"
        run: bash scripts/verify-clean-checkout.sh
